<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CISF Login</title>

<link rel="stylesheet" href="../css/cisf.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-container">

<div class="login-box">

<h1>RINL</h1>

<h3>Material Gate Pass System</h3>

<h2>CISF Portal</h2>

<form id="loginForm">

<div class="input-box">

<i class="fa-solid fa-user-shield"></i>

<input
type="text"
placeholder="CISF ID"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<i
class="fa-solid fa-eye"
id="togglePassword"></i>

</div>

<button type="submit">

Login

</button>

<p>

<a href="../index.html">

← Back to Home

</a>

</p>

</form>

</div>

</div>

<script src="../js/cisf.js"></script>

</body>

</html>
