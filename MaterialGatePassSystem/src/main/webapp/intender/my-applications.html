<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Applications</title>

<link rel="stylesheet" href="../css/applications.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<!-- Sidebar -->

<div class="sidebar">

<h2>RINL</h2>

<ul>

<li onclick="location.href='dashboard.html'">
<i class="fa-solid fa-house"></i>
Dashboard
</li>

<li onclick="location.href='apply-gatepass.html'">
<i class="fa-solid fa-file-circle-plus"></i>
Apply Gate Pass
</li>

<li class="active">
<i class="fa-solid fa-folder-open"></i>
My Applications
</li>

<li onclick="location.href='../reports/dashboard.html'">
<i class="fa-solid fa-chart-column"></i>
Reports
</li>

<li>
<i class="fa-solid fa-user"></i>
Profile
</li>

<li onclick="location.href='../index.html'">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</li>

</ul>

</div>

<!-- Main -->

<div class="main">

<div class="header">

<h1>My Applications</h1>

<input
type="text"
id="searchInput"
placeholder="Search Gate Pass">

</div>

<div class="filter">

<select id="statusFilter">

<option value="all">All Status</option>

<option value="Pending">Pending</option>

<option value="Approved">Approved</option>

<option value="Rejected">Rejected</option>

</select>

</div>

<div class="table-container">

<table id="applicationTable">

<thead>

<tr>

<th>Gate Pass ID</th>

<th>Material</th>

<th>Department</th>

<th>Date</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<!-- JavaScript will load data here -->

</tbody>

</table>

</div>

<!-- No Applications Message -->

<div id="noData" style="display:none;">

<h2>No Gate Pass Applications Found</h2>

<p>

Click <b>Apply Gate Pass</b> to create your first application.

</p>

<br>

<button onclick="location.href='apply-gatepass.html'">

Apply Gate Pass

</button>

</div>

</div>

</div>

<script src="../js/applications.js"></script>

</body>

</html>
